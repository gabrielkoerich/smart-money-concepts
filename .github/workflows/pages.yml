name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - README.md
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page-url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and deploy docs from the README with the shared theme
        id: deployment
        uses: gabrielkoerich/zola-docs-action@v1
        with:
          readme: README.md
          base-url: https://projects.gabrielkoerich.com/smart-money-concepts
          zola-version: "0.19.2"
          deploy: "true"
          cloudflare-token: ${{ secrets.CF_API_TOKEN }}
          extra: |
            author = "Gabriel Koerich"
            home_url = "https://gabrielkoerich.com"
            tagline = "Senior Engineer · AI Workflows · Solana / DeFi"
            nav = [{ name = "Docs", url = "@/_index.md" }, { name = "Projects", url = "https://projects.gabrielkoerich.com" }, { name = "npm", url = "https://www.npmjs.com/package/smart-money-concepts" }]
